# .gremlins.yaml — mutation-testing configuration template (warehouse-harness-template v2).
#
# gremlins (github.com/go-gremlins/gremlins, pinned to v0.6.0 in CI) reads
# this file automatically from the Go module root, so the `mutation-fast`
# CI job, the scheduled exhaustive `mutation` CI job, the `drift` job's
# coverage-quality check, and the local `make mutation` / `make
# mutation-full` targets all run with identical settings.
#
# Mutation testing is the sensor that tells us whether the tests actually
# ASSERT rather than merely execute. The thresholds below turn it into a
# blocking quality gate instead of a report.
silent: false

unleash:
  # A single worker with a generous timeout coefficient avoids spurious
  # TIMED OUT results on modules where mutants finish in tens of
  # milliseconds but parallel workers contend over the build cache.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # gremlins fails when the measured value is <= the threshold
    # (internal/report/report.go in gremlins itself), so a threshold must
    # sit strictly BELOW the number this repo can meet today. Measured
    # 2026-11-15 (gremlins v0.6.0, workers 1, timeout coefficient 30) with one
    # `gremlins unleash ./internal/domain/<pkg>` each (the loop `make mutation` and the
    # mutation-fast CI job run), killed/lived/not-covered:
    #   returnauthorization 41/0/0  returnreceipt 51/0/0  disposition 54/0/0  shared 25/0/0
    # efficacy 100.00% and mutant-coverage 100.00% in every package, so 99 holds them
    # there (gremlins fails at <= threshold). See HARNESS.md's mutation-testing section
    # for the tagless-switch-under-reports pitfall before assuming a low number means
    # missing tests.
    #
    # NOTE: the values are UNQUOTED on purpose. gremlins v0.6.0 reads the threshold
    # with a float64/int type assertion, so a quoted string ("95") is read as 0 and the
    # gate is silently DISABLED. Unquoted numbers are enforced (measured on
    # node-topology: efficacy: 100 on a 100% package fails with "below
    # efficacy-threshold"; "100" passes).
    efficacy: 99
    mutant-coverage: 99
