# Used by `helm lint` / `ct lint`: every optional value and component set at
# once (api + mcp + analytics projector/reports + frontend), so a template
# that renders alone but collides with another is caught by `helm lint`.
database:
  existingSecret: "returns-processing-db"
kafka:
  brokers: "kafka-0.kafka.warehouse-systems.svc.cluster.local:9092,kafka-1.kafka.warehouse-systems.svc.cluster.local:9092"
config:
  logLevel: "debug"
  outboxRelayInterval: "500ms"
  outboxMaxAttempts: 20
  shutdownDrainDelay: "5s"
  productClassificationConsumerGroup: "returns-processing-product-classification"
  orderLinesConsumerGroup: "returns-processing-order-lines"
  manifestConsumerGroup: "returns-processing-manifest"
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http

# The Gateway API route + Kong plugins on as well, with the real host path
# and parent (the same values warehouse-infra sets in production).
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/returns-processing
      pathType: PathPrefix
kongPlugins:
  cors:
    enabled: true
    origin: "http://localhost"
  prometheus:
    enabled: true
  opentelemetry:
    enabled: true
analytics:
  enabled: true
  existingSecret: "returns-processing-analytics-db"
  consumerGroup: "returns-processing-analytics"
frontend:
  enabled: true
