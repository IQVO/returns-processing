# Default values for returns-processing.
#
# This chart deploys the ONLY runtime the service has (ADR 0001): real
# Postgres and real Kafka. There is no in-memory mode and no consumer that
# is off by default, so a render without a database source or without
# brokers fails with a message naming the value (templates/_helpers.tpl).

replicaCount: 1

# The image is NEVER pulled from a registry in the local kind cluster: it is
# built from the local checkout and side-loaded with `kind load docker-image`
# (warehouse-infra overrides repository and tag with a content-derived
# local-<hash> tag). `pullPolicy: IfNotPresent` is required there, or the
# kubelet tries to pull from Docker Hub and ImagePullBackOffs.
image:
  repository: warehouse/returns-processing
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# The service writes nothing to disk (logs go to stdout, the migrations are
# embedded in the binary), so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# --- Gateway API (the OLTP route through Kong) ---
# Fleet decision (2026-10-13): ALL Kong configuration — routes AND plugins —
# belongs to the application's Helm chart, not warehouse-infra Terraform
# (chart-rendered objects are Helm/ArgoCD reconciled forever). This route
# exposes the api Service at /api/returns-processing on the platform
# Gateway, prefix stripped (the service serves /returns, /dispositions ...
# at the root). Off by default: warehouse-infra enables it with the real
# parentRefs (the platform Gateway) and path.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to the
# HTTPRoute above (and the MCP route) via the konghq.com/plugins annotation.
# Defaults off; warehouse-infra's values switch them on (prometheus so the
# Kong metrics rows light up, opentelemetry for traces, cors for the split
# localhost edge). NO auth plugin here, ever.
kongPlugins:
  cors:
    enabled: false
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Environment read by cmd/api (cmd/api/main.go header). Every key maps 1:1
# to one env var. The *_MODE variables are NEVER rendered: there is no
# in-memory mode to select (ADR 0001), the only runtime is kafka + Postgres.
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  # Empty = not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: how many times one outbox row may fail before the
  # relay excludes it from claims, so a poison row cannot block the relay
  # forever. 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the
  # listener. Empty = not rendered; the binary defaults to 5s.
  shutdownDrainDelay: ""
  # The STABLE consumer group ids of the three local-copy consumers
  # (MANDATORY: the binary exits at boot without them, and the chart refuses
  # to render with an empty one). They are fixed names, not derived from the
  # pod, so a rescheduled pod resumes from its committed offsets. Do not
  # rename them in a running environment: a new group id re-reads the topic
  # from the start. Env names pinned in .claude/rules/integration-events.md.
  productClassificationConsumerGroup: "returns-processing-product-classification"  # PRODUCT_CLASSIFICATION_CONSUMER_GROUP (warehouse.product-master.events)
  orderLinesConsumerGroup: "returns-processing-order-lines"                        # ORDER_LINES_CONSUMER_GROUP (warehouse.order-management.events)
  manifestConsumerGroup: "returns-processing-manifest"                             # MANIFEST_CONSUMER_GROUP (warehouse.fulfillment.events)

# MANDATORY: the chart refuses to render unless database.url or
# database.existingSecret is set (templates/_helpers.tpl:
# returns-processing.requireDatabase).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup step,
  # never for the runtime pgxpool, which always uses existingSecretKey /
  # DATABASE_URL. golang-migrate takes a session-scoped pg_advisory_lock that
  # PgBouncer's transaction pooling cannot honour. `optional: true` on the
  # rendered secretKeyRef so a secret without this key still starts the pod:
  # the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# MANDATORY: KAFKA_BROKERS (comma-separated). No default on purpose: the
# service runs on real Kafka only (ADR 0001) and the chart refuses to render
# without brokers. Produced topic: warehouse.returns-processing.events;
# consumed: warehouse.product-master.events, warehouse.order-management.events,
# warehouse.fulfillment.events. The service never creates topics through an
# admin API: the relay's writer and the consumers' dead-letter writers
# auto-create the service's own topics on first write
# (AllowAutoTopicCreation, the fleet convention: the cluster broker creates
# every business topic on first write and infrastructure declares none), and
# /readyz does not wait for any topic. A consumed topic that does not exist
# yet (its producer has not written) shows as consumer retry logs, not as
# unreadiness.
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list.
extraEnv: []

# The Postgres dial (migrations + ping) at boot is bounded-retried by
# testcontainers-proven code paths; periodSeconds * failureThreshold of the
# startup probe gives a ~60 s window before the kubelet gives up. Once it
# succeeds, liveness takes over (/healthz is liveness only). Readiness uses
# /readyz, which checks the drain gate, Postgres AND that a Kafka broker
# answers a metadata request (reachability only, never topics; the verdict
# is cached for a few seconds): a Kafka outage takes the pod out of the
# Service and a shutdown flips it to not-ready first, both by design.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Room for the binary's graceful shutdown, sequential in the worst case:
# SHUTDOWN_DRAIN_DELAY (default 5s) + HTTP drain (10s) + consumers drain
# (10s) + outbox relay drain (10s) = 35s. Keep it above that sum if you
# raise config.shutdownDrainDelay.
terminationGracePeriodSeconds: 40

nodeSelector: {}
tolerations: []
affinity: {}

# --- MCP server ---
# cmd/mcp: a READ-ONLY Model Context Protocol server over Streamable HTTP
# (get_return, list_returns_by_order, get_disposition_policy) on the same
# Postgres as the api. A separate workload (component=mcp, Service
# <fullname>-mcp:8090); it never writes, never dials Kafka and has no auth
# (fleet rule: the ClusterIP boundary is the access control). DISABLED by
# default: the default render is unchanged.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/mcp/returns-processing rewritten to the SDK's /mcp endpoint.
  # Off by default; warehouse-infra turns it on with the real parentRefs.
  route:
    enabled: false
    path: "/api/mcp/returns-processing"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- A2A server ---
# cmd/a2a: a READ-ONLY Agent2Agent (A2A) server over JSON-RPC/HTTP (skills
# return_status, disposition_policy; the Agent Card at
# /.well-known/agent-card.json; ADR 0008) on the same Postgres as the api. A
# separate workload (component=a2a, Service <fullname>-a2a:8093); it never
# writes, never dials Kafka and has no auth (fleet rule: the ClusterIP
# boundary is the access control). DISABLED by default: the default render is
# unchanged.
a2a:
  enabled: false
  replicaCount: 1
  httpAddr: ":8093"
  # The absolute URL the Agent Card advertises (A2A_AGENT_URL, mandatory in
  # the binary). Empty = this release's in-cluster Service DNS name,
  # http://<fullname>-a2a.<namespace>.svc.cluster.local:8093/.
  agentUrl: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Kong exposure of the A2A server (a2a-route.yaml): host path
  # /api/a2a/returns-processing rewritten to /, so the card stays reachable at
  # /api/a2a/returns-processing/.well-known/agent-card.json. Off by default;
  # warehouse-infra turns it on with the real parentRefs.
  route:
    enabled: false
    path: "/api/a2a/returns-processing"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- Analytics read side (ADR 0007) ---
# The returns data product: the projector (cmd/returns-projector, the ONLY
# writer of the analytical database, consuming the analytics topic
# warehouse.returns-processing.analytics) and the read-only reports binary
# (cmd/returns-reports, GET /reports/disposition-mix, /reports/value-recovery,
# /reports/return-cycle-time and /reports/freshness). DISABLED by default:
# the default render is unchanged.
#
# Enabling it renders the projector Deployment (component
# analytics-projector, /healthz + /readyz on :8091, no Service) and the
# reports Deployment + Service <fullname>-reports:80 (component
# analytics-reports, :8092), plus a Secret with ANALYTICS_DATABASE_URL when
# analytics.url is set. The chart refuses to render analytics without a DSN
# source (analytics.url or analytics.existingSecret) or without a consumer
# group: the binaries exit at boot otherwise (crash-loop). Kafka brokers are
# already mandatory for every render of this chart.
#
# Deliberately NOT HPA-scalable: the projector keeps per-process
# consumer/offset state and the reports Service has no session affinity --
# replica counts are fixed values.
analytics:
  enabled: false
  # The analytical database is SEPARATE from database.* (OLTP): the
  # projector has no credentials on OLTP data and the reports pool is
  # read-only. Direct DSN (no PgBouncer): the projector runs the embedded
  # analytical migrations through it.
  url: ""
  existingSecret: ""
  existingSecretKey: "ANALYTICS_DATABASE_URL"
  # ANALYTICS_CONSUMER_GROUP: the projector's STABLE consumer group (no
  # default in the binary): a rescheduled pod resumes from its committed
  # offsets, and a brand-new group replays from the earliest retained offset
  # (the backfill).
  consumerGroup: "returns-processing-analytics"
  projector:
    replicaCount: 1
    # ADMIN_ADDR (/healthz and /readyz) and its container port.
    adminAddr: ":8091"
    adminPort: 8091
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []

# --- frontend (Module Federation REMOTE `returns_mfe`) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod (component=frontend). In the kind cluster it is
# reached through warehouse-infra's Nginx web gateway at
# http://localhost/mfes/returns-processing/ -- never through Kong, which
# serves APIs only. The remote reads its API origin at runtime from the
# console's /config.json (`${apiOrigin}/api/returns-processing`), so nothing
# about it is configured here. No ingress/httproute for it and the Service
# stays ClusterIP: frontend path routing is owned by the Nginx web gateway.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag (image
# built from web/; side-loaded into kind, so keep pullPolicy IfNotPresent).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/returns-processing-frontend
    pullPolicy: IfNotPresent
    # Empty = the chart's appVersion. warehouse-infra overrides it.
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
