{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "returns-processing.a2aFullname" . }}
  labels:
    {{- include "returns-processing.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type }}
  ports:
    - port: {{ .Values.a2a.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=a2a pins this Service to the a2a Deployment's pods
  # (tests/test_service_selectors.py).
  selector:
    {{- include "returns-processing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
{{- end }}
